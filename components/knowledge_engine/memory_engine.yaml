apiVersion: v1
kind: KnowledgeEngine
metadata:
  name: long_term_memory
  label:
    en_US: LongTermMemory
    zh_Hans: 长期记忆
  description:
    en_US: 'Long-term memory for LangBot. Configure embedding model and isolation mode here. Supports memory import via JSON files.'
    zh_Hans: 'LangBot 长期记忆。在此配置嵌入模型和隔离模式，支持通过 JSON 文件导入记忆。'

spec:
  creation_schema:
    - name: embedding_model_uuid
      label:
        en_US: Embedding Model
        zh_Hans: 嵌入模型
      description:
        en_US: Embedding model used for semantic search.
        zh_Hans: 用于语义检索的嵌入模型。
      type: embedding-model-selector
      required: true
      default: ''

    - name: isolation
      label:
        en_US: Isolation Mode
        zh_Hans: 隔离模式
      description:
        en_US: 'session: each group/chat has independent memory. bot: all sessions share memory.'
        zh_Hans: 'session：每个群/会话独立记忆。bot：所有会话共享记忆。'
      type: select
      options:
        - name: session
          label:
            en_US: Session
            zh_Hans: 会话隔离
        - name: bot
          label:
            en_US: Bot
            zh_Hans: 全局共享
      default: session

    - name: recency_half_life_days
      label:
        en_US: Recency Half-Life Days
        zh_Hans: 时效半衰期天数
      description:
        en_US: Controls how quickly older episodic memories lose ranking weight during automatic recall.
        zh_Hans: 控制自动召回时旧情景记忆的时效衰减速度。
      type: integer
      required: false
      default: 30

    - name: auto_recall_top_k
      label:
        en_US: Auto Recall Top K
        zh_Hans: 自动召回条数
      description:
        en_US: Number of episodic memories injected automatically before model invocation.
        zh_Hans: 模型调用前自动注入的情景记忆条数。
      type: integer
      required: false
      default: 3

    - name: retrieval_strategy
      label:
        en_US: Retrieval Strategy
        zh_Hans: 检索策略
      description:
        en_US: "auto tries hybrid search first and falls back to vector search. Use vector for maximum backend compatibility."
        zh_Hans: "auto 会优先尝试混合检索，失败时回退向量检索。vector 兼容性最好。"
      type: select
      options:
        - name: auto
          label:
            en_US: Auto
            zh_Hans: 自动
        - name: vector
          label:
            en_US: Vector
            zh_Hans: 向量
        - name: hybrid
          label:
            en_US: Hybrid
            zh_Hans: 混合
      required: false
      default: auto

    - name: vector_weight
      label:
        en_US: Vector Weight
        zh_Hans: 向量权重
      description:
        en_US: Vector similarity weight used by hybrid search.
        zh_Hans: 混合检索中的向量相似度权重。
      type: number
      required: false
      default: 0.7

    - name: exact_match_boost
      label:
        en_US: Exact Match Boost
        zh_Hans: 精确匹配增强
      description:
        en_US: Boost exact matches on episode IDs, sender identity, tags, and content snippets.
        zh_Hans: 对 episode ID、说话人、标签和内容片段的精确匹配进行增强。
      type: boolean
      required: false
      default: true

  retrieval_schema:
    - name: top_k
      label:
        en_US: Top K
        zh_Hans: 返回条数
      description:
        en_US: Number of results to return.
        zh_Hans: 检索返回的结果数量。
      type: integer
      default: 5

execution:
  python:
    path: memory_engine.py
    attr: LongTermMemoryEngine
